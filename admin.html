<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการคลังสินค้า & พิมพ์ใบจ่าหน้า | CHOCO CRAFT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; border: 2px solid #000; padding: 20px; }
    }
  </style>
</head>
<body class="bg-stone-100 text-stone-800">

  <nav class="bg-stone-900 text-white p-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-amber-400">📦 ระบบหยิบสินค้า & แพ็คพัสดุ (Fulfillment)</h1>
      <a href="index.html" class="text-sm bg-stone-700 px-3 py-1.5 rounded hover:bg-stone-600">← กลับหน้าร้าน</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto py-8 px-4">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold">รายการคำสั่งซื้อจาก Google Sheets</h2>
      <button onclick="loadOrders()" class="bg-amber-500 hover:bg-amber-400 text-stone-900 font-bold px-4 py-2 rounded shadow">
        🔄 รีเฟรชข้อมูล
      </button>
    </div>

    <div id="loading" class="text-center py-10 text-stone-500">กำลังโหลดข้อมูลออเดอร์...</div>
    <div id="ordersList" class="grid md:grid-cols-2 gap-6"></div>
  </main>

  <!-- Modal สำหรับดูใบจ่าหน้าพัสดุและสั่งพิมพ์ -->
  <div id="labelModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl">
      <div id="printArea" class="border-2 border-stone-800 p-5 rounded bg-white">
        <div class="border-b-2 border-stone-800 pb-3 mb-3 flex justify-between items-start">
          <div>
            <p class="text-xs font-bold uppercase text-stone-500">ผู้ส่ง (SENDER)</p>
            <p class="font-bold text-sm">ร้าน CHOCO CRAFT</p>
            <p class="text-xs">99/9 ถ.สุขุมวิท เขตวัฒนา กรุงเทพฯ 10110</p>
            <p class="text-xs">โทร: 02-999-9999</p>
          </div>
          <div class="text-right">
            <span id="lblOrderId" class="font-mono font-bold text-sm bg-stone-200 px-2 py-1 rounded"></span>
          </div>
        </div>

        <div class="py-3">
          <p class="text-xs font-bold uppercase text-stone-500">กรุณาส่ง (RECEIVER)</p>
          <p id="lblName" class="text-xl font-bold mt-1"></p>
          <p id="lblPhone" class="text-base font-semibold mt-0.5"></p>
          <p id="lblAddress" class="text-base mt-2 leading-relaxed"></p>
        </div>

        <div class="border-t-2 border-dashed border-stone-400 pt-3 mt-3 text-xs">
          <p class="font-bold mb-1">รายการสินค้าในกล่อง (Packing List):</p>
          <p id="lblItems"></p>
        </div>
      </div>

      <div class="flex justify-end gap-3 mt-5">
        <button onclick="closeModal()" class="px-4 py-2 bg-stone-200 rounded font-medium">ปิดหน้าต่าง</button>
        <button onclick="window.print()" class="px-5 py-2 bg-stone-900 text-amber-400 rounded font-bold">
          🖨️ พิมพ์ใบจ่าหน้าพัสดุ
        </button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwA5XcJjzE47KAkfRXslYKkBpswuR982C-VAmRhXjpNyvVK2YQeeHkyiMoCFp0Kmz7vKg/exec";

    async function loadOrders() {
      const listEl = document.getElementById("ordersList");
      const loadingEl = document.getElementById("loading");
      listEl.innerHTML = "";
      loadingEl.style.display = "block";

      try {
        const res = await fetch(SCRIPT_URL);
        const orders = await res.json();
        loadingEl.style.display = "none";

        orders.forEach(order => {
          const isPacked = order.status.includes("แพ็คแล้ว");
          const card = document.createElement("div");
          card.className = `bg-white p-5 rounded-xl shadow border-l-4 ${isPacked ? 'border-green-500' : 'border-amber-500'}`;
          
          card.innerHTML = `
            <div class="flex justify-between items-start mb-3">
              <div>
                <span class="font-mono font-bold text-lg">${order.orderId}</span>
                <p class="text-xs text-stone-400">${order.timestamp}</p>
              </div>
              <span class="text-xs font-bold px-2.5 py-1 rounded-full ${isPacked ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'}">
                ${order.status}
              </span>
            </div>

            <!-- ส่วนหยิบสินค้า (Pick List) -->
            <div class="bg-stone-50 p-3 rounded-lg mb-3 border border-stone-200">
              <p class="text-xs font-bold text-stone-500 mb-1">📋 รายการที่ต้องหยิบลงกล่อง:</p>
              <ul class="text-sm space-y-1">
                ${order.qtySku1 > 0 ? `<li>☑️ <b>[SKU-01] Dark Chocolate 75%</b> : <span class="text-amber-700 font-bold">${order.qtySku1} แท่ง</span></li>` : ''}
                ${order.qtySku2 > 0 ? `<li>☑️ <b>[SKU-02] Milk Hazelnut Crunch</b> : <span class="text-amber-700 font-bold">${order.qtySku2} แท่ง</span></li>` : ''}
              </ul>
            </div>

            <div class="text-sm text-stone-700 mb-4">
              <p><b>ผู้รับ:</b> ${order.name} (${order.phone})</p>
              <p class="truncate"><b>ที่อยู่:</b> ${order.address}</p>
            </div>

            <div class="flex gap-2">
              <button onclick='openLabel(${JSON.stringify(order)})' class="flex-1 bg-stone-800 hover:bg-stone-700 text-white text-sm font-medium py-2 rounded">
                🏷️ ดู/พิมพ์ใบจ่าหน้า
              </button>
              ${!isPacked ? `
                <button onclick="markAsPacked('${order.orderId}')" class="flex-1 bg-green-600 hover:bg-green-500 text-white text-sm font-medium py-2 rounded">
                  ✅ ยืนยันแพ็คเสร็จแล้ว
                </button>
              ` : ''}
            </div>
          `;
          listEl.appendChild(card);
        });
      } catch (err) {
        loadingEl.innerText = "โหลดข้อมูลไม่สำเร็จ ตรวจสอบ URL ของ Google Apps Script";
      }
    }

    async function markAsPacked(orderId) {
      if (!confirm(`ยืนยันว่าหยิบสินค้าและแพ็คออเดอร์ ${orderId} เรียบร้อยแล้ว?`)) return;
      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "updateStatus", orderId: orderId, status: "แพ็คแล้ว (Packed)" })
      });
      loadOrders();
    }

    function openLabel(order) {
      document.getElementById("lblOrderId").innerText = order.orderId;
      document.getElementById("lblName").innerText = order.name;
      document.getElementById("lblPhone").innerText = "โทร: " + order.phone;
      document.getElementById("lblAddress").innerText = order.address;
      
      let itemsText = [];
      if (order.qtySku1 > 0) itemsText.push(`Dark Chocolate 75% x ${order.qtySku1}`);
      if (order.qtySku2 > 0) itemsText.push(`Milk Hazelnut x ${order.qtySku2}`);
      document.getElementById("lblItems").innerText = itemsText.join(" | ");

      const modal = document.getElementById("labelModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeModal() {
      const modal = document.getElementById("labelModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    loadOrders();
  </script>
</body>
</html>
